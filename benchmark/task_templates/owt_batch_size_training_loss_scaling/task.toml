schema_version = "1.4"

# The verifier runs in its own container, so the submission has to be collected
# out of the agent's: /app carries law.py, explain.md and anything the law loads.
artifacts = [
    { source = "/app" },
]

[task]
name = "scaling-law-sources/owt-batch-size-training-loss-scaling"
version = "0.1.0"
description = "Forecast OpenWebText training loss across compute, batch-size, and learning-rate scales."
authors = [{ name = "Scaling-law source conversion", email = "" }]
keywords = ["scaling-law", "language-model", "batch-size", "optimization"]

[metadata]
difficulty = "medium"
difficulty_explanation = "The task forecasts noisy late learning curves across five global batch scales and three learning rates."
category = "scientific_discovery"
tags = ["scaling_law", "symbolic_regression", "language_model", "optimization"]
custom_docker_compose = false

[verifier]
timeout_sec = 600.0
# A dedicated container. The agent has root in its own environment, so a
# verifier sharing it could be subverted before it ever starts -- and the
# held-out split would land in a container the agent had already prepared.
environment_mode = "separate"
# Root in that dedicated container, so the grader can read the collected
# artifacts whatever mode they were copied with. The candidate law is dropped
# to an unprivileged uid by guard.py regardless.
user = "root"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
